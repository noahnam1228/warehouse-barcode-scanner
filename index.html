<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Warehouse PDF417 Scanner</title>
  <script src="https://unpkg.com/@zxing/browser@0.2.0"></script>
  <style>
    :root{--navy:#12366b;--bg:#0d1117;--text:#fff;--muted:#c8d1dc;--red:#ff4b3e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    header{padding:16px 18px;background:var(--navy)}
    header h1{margin:0;font-size:21px}
    header p{margin:5px 0 0;font-size:12px;opacity:.85}
    main{max-width:760px;margin:auto;padding:14px}
    #scanner{
      position:relative;width:100%;aspect-ratio:4/3;max-height:72vh;
      overflow:hidden;border-radius:16px;background:#000
    }
    #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .guide{
      position:absolute;left:5%;right:5%;top:28%;height:44%;
      border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px #0006;
      pointer-events:none;z-index:10
    }
    .line{position:absolute;left:7%;right:7%;top:50%;height:2px;background:var(--red);z-index:11}
    .status{margin-top:12px;padding:12px;border-radius:11px;background:#18202b;font-size:14px;line-height:1.4;word-break:break-word}
    .hint{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5}
    .manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
    .manual input{padding:13px;border:0;border-radius:10px;font-size:15px;font-family:Consolas,monospace;text-transform:uppercase}
    .manual button,.retry{border:0;border-radius:10px;padding:0 16px;font-weight:800}
    .manual button{background:#fff;color:#111}
    .retry{width:100%;padding:13px;margin-top:10px;background:var(--navy);color:#fff}
    .langbtn{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:900}
    .langbtn.active{background:#fff;color:var(--navy);border-color:#fff}
  </style>
</head>
<body>
<header><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h1>WAREHOUSE PDF417 SCANNER</h1><p id="subTitle"></p></div><div style="display:flex;gap:4px"><button class="langbtn" data-lang="ko" type="button">한국어</button><button class="langbtn" data-lang="en" type="button">EN</button><button class="langbtn" data-lang="es" type="button">ES</button></div></div></header>

<main>
  <div id="scanner">
    <video id="video" playsinline muted></video>
    <div class="guide"></div>
    <div class="line"></div>
  </div>

  <div id="status" class="status">Starting camera…</div>
<div class="hint" id="scanHint"></div>

  <div class="manual">
    <input id="manual" placeholder="LNE-0001-...">
    <button id="manualBtn" type="button"></button>
  </div>

  <button id="retry" class="retry" type="button" style="display:none"></button>
</main>

<script>
const params=new URLSearchParams(location.search);const returnUrl=params.get("return")||"";const LANG_KEY="warehouse_scanner_lang";
const S={
 ko:{sub:"팔렛 PDF417 실시간 카메라 스캐너",starting:"카메라 시작 중...",ready:"카메라 준비 완료 — PDF417 팔렛 바코드를 스캔하세요.",hint:"PDF417 바코드를 평평하게 펴서 박스 중앙에 맞추세요. 화면을 최대한 채우고 빛 반사를 피하세요. 스캔 데이터에서 <b>LNE-...</b> 팔렛 번호를 추출합니다.",use:"사용",restart:"카메라 다시 시작",noLne:"PDF417은 읽었지만 유효한 LNE 팔렛 번호를 찾지 못했습니다.",hold:"조금만 그대로 유지하세요…",read:"바코드 인식 완료",cameraFail:"카메라/스캐너를 시작할 수 없습니다. 카메라 접근을 허용한 뒤 다시 시작하세요."},
 en:{sub:"Live camera scanner for pallet PDF417 barcodes",starting:"Starting camera...",ready:"Camera ready — scan the PDF417 pallet barcode.",hint:"Keep the PDF417 symbol flat and centered inside the box. Fill as much of the box as possible and avoid glare. The scanner extracts the <b>LNE-...</b> pallet number from the decoded data.",use:"USE",restart:"RESTART CAMERA",noLne:"PDF417 decoded, but no valid LNE pallet number was found.",hold:"Hold steady…",read:"Barcode read",cameraFail:"Camera/scanner could not start. Allow camera access, then restart the camera."},
 es:{sub:"Escáner en vivo para códigos PDF417 de pallets",starting:"Iniciando cámara...",ready:"Cámara lista — escanee el código PDF417 del pallet.",hint:"Mantenga el código PDF417 plano y centrado dentro del recuadro. Llene la mayor parte del recuadro y evite reflejos. El escáner extrae el número de pallet <b>LNE-...</b> de los datos.",use:"USAR",restart:"REINICIAR CÁMARA",noLne:"Se leyó el PDF417, pero no se encontró un número de pallet LNE válido.",hold:"Mantenga estable…",read:"Código leído",cameraFail:"No se pudo iniciar la cámara/escáner. Permita el acceso a la cámara y vuelva a intentarlo."}
};
function initialLang(){const q=(params.get("lang")||"").toLowerCase();if(S[q])return q;try{const x=localStorage.getItem(LANG_KEY);if(S[x])return x}catch(e){}const b=(navigator.language||"en").toLowerCase();if(b.startsWith("es"))return"es";if(b.startsWith("ko"))return"ko";return"en"}
let LANG=initialLang();function st(k){return(S[LANG]&&S[LANG][k])||S.en[k]||k}
function applyLang(lang){if(!S[lang])return;LANG=lang;document.documentElement.lang=lang;try{localStorage.setItem(LANG_KEY,lang)}catch(e){}document.querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));document.getElementById("subTitle").textContent=st("sub");document.getElementById("scanHint").innerHTML=st("hint");document.getElementById("manualBtn").textContent=st("use");document.getElementById("retry").textContent=st("restart")}
document.querySelectorAll(".langbtn").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
let controls = null;
let finished = false;
let lastCode = "";
let lastCodeAt = 0;

function setStatus(t){
  document.getElementById("status").textContent = t;
}

function normalizeText(v){
  return String(v || "")
    .toUpperCase()
    .replace(/[\u0000-\u001F\u007F]/g, " ")
    .trim();
}

function extractPalletCode(raw){
  const text = normalizeText(raw);

  // Normal expected format, e.g. LNE-0001-2026081300295
  let m = text.match(/LNE-\d{4}-[A-Z0-9]+/);
  if (m) return m[0];

  // Tolerate spaces around hyphens.
  m = text.match(/LNE\s*-\s*\d{4}\s*-\s*[A-Z0-9]+/);
  if (m) return m[0].replace(/\s+/g, "");

  return "";
}

function stopCamera(){
  try{
    if(controls) controls.stop();
  }catch(e){}
  controls = null;

  const video = document.getElementById("video");
  if(video && video.srcObject){
    try{ video.srcObject.getTracks().forEach(t => t.stop()); }catch(e){}
    video.srcObject = null;
  }
}

function finish(code){
  if(finished) return;
  code = String(code || "").trim().toUpperCase();

  if(!code.startsWith("LNE-")){
    setStatus(st("noLne"));
    return;
  }

  finished = true;
  setStatus(st("read")+": "+code);
  if(navigator.vibrate) navigator.vibrate(120);
  stopCamera();

  if(returnUrl){
    const u = new URL(returnUrl);
    u.searchParams.set("code", code);
    u.searchParams.set("lang", LANG);
    location.replace(u.toString());
  }else{
    setStatus("Barcode read: " + code + " (return URL missing)");
  }
}

async function startScanner(){
  finished = false;
  document.getElementById("retry").style.display = "none";
  setStatus(st("starting"));

  try{
    if(!window.ZXingBrowser || !ZXingBrowser.BrowserPDF417Reader){
      throw new Error("PDF417 scanner library did not load.");
    }

    const reader = new ZXingBrowser.BrowserPDF417Reader(undefined, {
      delayBetweenScanAttempts: 100,
      delayBetweenScanSuccess: 300
    });

    controls = await reader.decodeFromConstraints(
      {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      },
      document.getElementById("video"),
      (result, error, scanControls) => {
        if(!result || finished) return;

        const raw = result.getText ? result.getText() : String(result.text || "");
        const code = extractPalletCode(raw);

        if(!code){
          setStatus(st("noLne"));
          return;
        }

        // Require same LNE twice in a short interval to reduce accidental reads.
        const now = Date.now();
        if(code === lastCode && now - lastCodeAt < 1800){
          controls = scanControls || controls;
          finish(code);
        }else{
          lastCode = code;
          lastCodeAt = now;
          setStatus(st("hold")+" "+code);
        }
      }
    );

    setStatus(st("ready"));
  }catch(err){
    console.error(err);
    setStatus(st("cameraFail"));
    document.getElementById("retry").style.display = "block";
  }
}

document.getElementById("manualBtn").addEventListener("click",()=>{
  finish(document.getElementById("manual").value);
});

document.getElementById("manual").addEventListener("keydown",e=>{
  if(e.key === "Enter") document.getElementById("manualBtn").click();
});

document.getElementById("retry").addEventListener("click",()=>{
  stopCamera();
  startScanner();
});

window.addEventListener("pagehide", stopCamera);
applyLang(LANG);
startScanner();
</script>
</body>
</html>
